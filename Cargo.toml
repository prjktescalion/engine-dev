[workspace]
members = [
    "engine",
    "studio",
    "ball",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["NeuDel-II Team"]

[workspace.dependencies]
# Engine core (uncomment as each module is implemented)
wgpu = "22"
winit = "0.30"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
rapier2d = { version = "0.22", features = ["default"] }
rodio = "0.20"

# Scripting bridges
pyo3 = { version = "0.25", features = ["auto-initialize"] }

# Studio (pure-Rust editor)
gpui = { git = "https://github.com/zed-industries/zed", branch = "main" }
# `font-kit` is required on macOS: without it gpui_platform silently uses
# NoopTextSystem — UI lays out and is clickable, but no glyphs render.
gpui_platform = { git = "https://github.com/zed-industries/zed", branch = "main", features = ["font-kit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rfd = "0.15"
base64 = "0.22"
dirs = "5"
uuid = { version = "1", features = ["v4", "serde"] }
